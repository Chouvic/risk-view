[project]
name = "riskview"
version = "0.1.0"
description = "Fund-level FX risk analytics and hedge recommendations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
riskview = "riskview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Turn SQLAlchemy warnings into failures. The one that matters: "Dialect
# sqlite+pysqlite does not support Decimal objects natively" — the warning that
# fires the moment someone reaches for Numeric instead of db.types.ExactDecimal.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
extend-select = ["I"]  # import sorting

[tool.ruff.lint.per-file-ignores]
# Autogenerated revisions always `import sqlalchemy as sa` (F401 when unused)
# and emit op.create_table calls past the line limit.
"src/riskview/db/migrations/versions/*.py" = ["E501", "F401"]
